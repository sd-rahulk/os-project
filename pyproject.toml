[project]
name = "smartlab-os"
version = "0.1.0"
description = "SmartLab OS monitoring and resource management system"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "sqlalchemy>=2.0,<3",
  "pydantic-settings>=2.6,<3",
  "python-jose[cryptography]>=3.3,<4",
  "passlib>=1.7,<2",
  "python-multipart>=0.0.12,<1",
  "psutil>=6.0,<7",
  "httpx>=0.27,<1",
  "pytest>=8,<9",
  "pytest-asyncio>=0.24,<1",
  "reportlab>=4.2,<5",
  "websockets>=13,<14",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
